name: MacTV Telugu Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Run Fetcher
        run: python mactom3u.py

      - name: Deploy Update
        run: |
          git config --local user.email "bot@tvtelugu.com"
          git config --local user.name "tvtelugu-bot"
          
          for file in Live.m3u Channels.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Playlist Updated: $(date)"
          git pull --rebase origin main
          git push origin main
